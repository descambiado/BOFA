# BOFA v3.0.0 alpha 1 - Python project configuration

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bofa-runtime"
version = "3.0.0a1"
description = "Execution fabric for authorized security workflows, evidence and policy-gated AI"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "descambiado", email = "david@descambiado.com"}
]
maintainers = [
    {name = "descambiado", email = "david@descambiado.com"}
]
keywords = [
    "cybersecurity",
    "bug-bounty",
    "web-security",
    "api-security",
    "reconnaissance",
    "duplicate-detection",
    "evidence",
    "security-automation",
    "security-tools",
    "mcp",
    "llm",
    "fastapi",
    "react"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Security"
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.31",
    "PyJWT>=2.13.0",
    "cryptography>=49.0.0",
    "docker>=7.0.0",
    "psutil>=5.9.8",
    "pyyaml>=6.0.1",
    "colorama>=0.4.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.5.0"
]
testing = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0"
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.7",
    "mkdocstrings[python]>=0.23.0"
]
mcp = [
    "mcp>=1.0.0"
]
agent = [
    "mcp>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/descambiado/BOFA"
Documentation = "https://github.com/descambiado/BOFA/tree/main/docs"
Repository = "https://github.com/descambiado/BOFA"
"Bug Reports" = "https://github.com/descambiado/BOFA/issues"
Changelog = "https://github.com/descambiado/BOFA/blob/main/CHANGELOG.md"

[project.scripts]
bofa-cli = "cli.bofa_cli:main"
bofa-server = "api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "cli*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg",
    ".venv",
    "venv"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py"
]
python_classes = [
    "Test*"
]
python_functions = [
    "test_*"
]

[tool.coverage.run]
source = ["api", "cli", "scripts"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
